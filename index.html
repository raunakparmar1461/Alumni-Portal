<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCE Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Alumni</a>
        <a href="#">Directory</a>
        <a href="#">Register</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>
    
    <h1 class="head">
        <img src="CLG_logo-removebg-preview.png" alt="DCE Logo" class="logo">
        DCE CONNECT
    </h1>
    
    <p class="p">Welcome to the Alumni Portal of Darbhanga College of Engineering,  Darbhanga</p>
    <p class="d">Connecting Alumni • Students • Faculty</p>

    <section class="search-section">

        <div class="search-container">

            <div class="search-input">

                <span>🔍</span>

                <input
                    type="text"
                    id="search"
                    placeholder="Search by name, company, batch or designation">

            </div>

            <div class="dropdowns">

                <div class="drop">
                    <label>Search By</label>

                    <select id="searchType">
                        <option value="name">Name</option>
                        <option value="batch">Batch</option>
                        <option value="organisation_name">Company</option>
                        <option value="designation">Designation</option>
                    </select>

                </div>

                <div class="drop">

                    <label>Organisation</label>

                    <select id="organisation">
                        <option value="All">All</option>
                        <option value="Government">Government</option>
                        <option value="Private">Private</option>
                    </select>

                </div>

            </div>

        </div>


        <div class="branch-buttons">

                <button class="active" data-branch="All">All</button>
                <button data-branch="CS">CSE</button>
                <button data-branch="EEE">EEE</button>
                <button data-branch="CE">CE</button>
                <button data-branch="ME">ME</button>
                <button data-branch="CS(CYBER)">CSE(CYBER)</button>
                <button data-branch="FTS">FTS</button>
                <button data-branch="M&C">M&C</button>

        </div>
</section>

<div id="alumni-container" class="cards"></div>
    <div class="pagination">

        <button id="prevBtn">◀ Previous</button>

        <span id="pageNumbers"></span>

        <button id="nextBtn">Next ▶</button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>


</body>
</html>
